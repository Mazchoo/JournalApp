<!-- Editable Text Area (server-rendered) -->
<div class='col col-md-11 py-2 border border-dark rounded bg-white mt-2 entry-region-{{ item.index }}' name='paragraph{{ item.index }}'>
    <form method = 'get' action = '' class = 'card container'>
        <textarea class='entry-text save-content' name='message' cols='40' rows='10' required='' id='paragraph{{ item.index }}' aria-hidden='true' data-height='{{ item.data.height }}' data-allow-ai-synthesis='{{ item.data.allow_ai_synthesis }}' data-raw-html='{{ item.data.raw_html }}'>{{ item.data.text|safe }}</textarea>
        <div class='raw-html-editor d-none w-100 overflow-hidden py-2'>
            <div class='mb-2'>
                <button type='button'
                        class='btn btn-sm btn-outline-secondary allow-syn'
                        id='raw-html-generate{{ item.index }}'
                        data-toggle='tooltip'
                        style='font-size: 0.9rem; white-space: nowrap;'>
                    Generate
                </button>
            </div>
            <iframe class='raw-html-frame w-100 d-block border-0' title='Raw HTML' scrolling='no'></iframe>
            <textarea class='raw-html-source d-none w-100' aria-label='Raw HTML' spellcheck='false' wrap='off'></textarea>
        </div>
    </form>
</div>
<!-- Edit Buttons -->
<div class='col col-md-1 py-2 entry-region-{{ item.index }}'>
    <div class='row ml-3 mt-3'>
        <button id='delete-content{{ item.index }}' class='btn btn-primary btn-sm talk-to px-2 edit-button' data-toggle='tooltip' name='.entry-region-{{ item.index }}'>
            <i id='delete-content{{ item.index }}' class='fa fa-trash style header_button_icon' name='.entry-region-{{ item.index }}'></i>
        </button>
    </div>
    <div class='row ml-3 mt-3'>
        <button id='insert-paragraph{{ item.index }}' class='btn btn-primary btn-sm talk-to px-2 edit-button' data-toggle='tooltip' name='.entry-region-{{ item.index }}'>
            <i id='insert-paragraph{{ item.index }}' class='fa fa-paragraph style header_button_icon' name='.entry-region-{{ item.index }}'></i>
        </button>
    </div>
    <div class='row ml-3 mt-3'>
        <button id='insert-media{{ item.index }}' class='btn btn-primary btn-sm talk-to px-2 edit-button' data-toggle='tooltip' name='.entry-region-{{ item.index }}'>
            <i id='insert-media{{ item.index }}' class='fa fa-picture-o style header_button_icon' name='.entry-region-{{ item.index }}'></i>
        </button>
    </div>
    <div class='row ml-3 mt-3'>
        <button id='move-content-up{{ item.index }}' class='btn btn-primary btn-sm talk-to px-2 edit-button' data-toggle='tooltip' name='.entry-region-{{ item.index }}'>
            <i id='move-content-up{{ item.index }}' class='fa fa-arrow-up style header_button_icon' name='.entry-region-{{ item.index }}'></i>
        </button>
    </div>
    <div class='row ml-3 mt-3'>
        <button id='move-content-down{{ item.index }}' class='btn btn-primary btn-sm talk-to px-2 edit-button' data-toggle='tooltip' name='.entry-region-{{ item.index }}'>
            <i id='move-content-down{{ item.index }}' class='fa fa-arrow-down style header_button_icon' name='.entry-region-{{ item.index }}'></i>
        </button>
    </div>
</div>

name: Frontend tests

on: [push]


jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
        - uses: actions/checkout@v4
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
              node-version: lts/*
              cache: npm
              cache-dependency-path: frontend/package-lock.json
        - name: Install dependencies
          run: npm ci
        - name: Test with Vitest
          run: npm test
